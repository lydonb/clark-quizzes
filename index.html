<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revolution Quest</title>
<style>
:root{
  --bg:#0f1b3d; --bg2:#182a5c; --card:#1f3470; --card2:#2a4290; --ink:#fff; --muted:#b8c4ee;
  --red:#e63946; --gold:#ffc93c; --green:#2ec27e; --bad:#ff6b6b; --blue:#4dabf7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 60%) fixed;
  color:var(--ink); font-family:"Trebuchet MS",Verdana,system-ui,sans-serif; font-size:19px; line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 140px}
.hidden{display:none!important}
h1{font-size:clamp(34px,8vw,54px);margin:8px 0 0;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
h1 span{color:var(--gold)}
.sub{color:var(--muted);margin:4px 0 18px}
.card{background:var(--card);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.card h3{margin:0 0 10px;font-size:17px;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px}
.bar{height:16px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
.xpbar>i{background:linear-gradient(90deg,var(--gold),#ffb000)}
.hpbar>i{background:linear-gradient(90deg,#ff4d5a,var(--red))}
.rank{display:flex;align-items:center;gap:14px}
.rank .big{font-size:46px}
.rank b{font-size:24px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 90px;background:var(--card2);padding:12px 8px;border-radius:14px;font-weight:bold;border:3px solid transparent;min-height:56px}
.seg button small{display:block;font-weight:normal;color:var(--muted);font-size:14px}
.seg button.on{border-color:var(--gold);background:#35509f}
.go{width:100%;font-size:30px;font-weight:bold;padding:18px;border-radius:20px;background:linear-gradient(#ff5a67,var(--red));box-shadow:0 6px 0 #9b1b27;margin-top:8px;transition:transform .08s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #9b1b27}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:rgba(0,0,0,.25);border-radius:14px;padding:8px 12px;font-size:15px}
.badge.locked{opacity:.35;filter:grayscale(1)}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* game */
.hud{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:6px}
.pill{background:rgba(0,0,0,.3);padding:6px 12px;border-radius:99px;font-weight:bold;white-space:nowrap}
.icon{background:rgba(0,0,0,.3);border-radius:99px;width:44px;height:44px;font-size:20px}
.enemy{margin:6px 0 4px;font-size:15px;color:var(--muted);display:flex;justify-content:space-between}
.dots{display:flex;gap:5px;margin:8px 0 14px}
.dots i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.15)}
.dots i.done{background:var(--green)} .dots i.miss{background:var(--bad)} .dots i.now{background:var(--gold)}
.tag{display:inline-block;background:var(--red);padding:3px 12px;border-radius:99px;font-size:14px;font-weight:bold;letter-spacing:1px;text-transform:uppercase}
.tag.rally{background:#b46cff}
.prompt{font-size:clamp(22px,5vw,28px);font-weight:bold;margin:12px 0 16px}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);padding:16px;border-radius:16px;border:3px solid transparent;box-shadow:0 4px 0 rgba(0,0,0,.3);min-height:64px;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:active:not(:disabled){transform:translateY(3px)}
.opt .key{background:rgba(0,0,0,.3);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-size:15px;flex:none}
.opt.ok{background:#1b7a52;border-color:var(--green)}
.opt.bad{background:#8d2b35;border-color:var(--bad)}
.opt.gone{opacity:.15;pointer-events:none}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:26px;font-weight:bold;min-height:90px}
.blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--gold);text-align:center;color:var(--gold);padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chip{background:var(--card2);padding:14px 20px;border-radius:14px;font-weight:bold;box-shadow:0 4px 0 rgba(0,0,0,.3);font-size:21px}
.chip.ok{background:#1b7a52}.chip.bad{background:#8d2b35}.chip.gone{opacity:.2}
.slots{display:grid;gap:8px;margin-bottom:14px}
.slot{display:flex;gap:10px;align-items:center;min-height:54px;padding:6px 12px;border-radius:14px;background:rgba(0,0,0,.25);border:3px dashed rgba(255,255,255,.2)}
.slot .n{background:var(--gold);color:#222;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:bold;flex:none}
.slot.filled{border-style:solid;border-color:var(--blue);background:var(--card);cursor:pointer}
.slot.ok{border-color:var(--green);background:#1b7a52}.slot.bad{border-color:var(--bad);background:#8d2b35}
.slot .yr{margin-left:auto;font-weight:bold;color:var(--gold)}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.small-go{background:var(--green);color:#06301e;font-weight:bold;padding:14px 22px;border-radius:14px;font-size:20px;box-shadow:0 4px 0 #17794f;margin-top:14px}
.small-go:disabled{opacity:.4}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.m{background:var(--card);padding:12px;border-radius:14px;text-align:left;border:3px solid transparent;font-size:17px;min-height:60px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.m.sel{border-color:var(--gold);background:#35509f}
.m.done{background:#1b7a52;border-color:var(--green);opacity:.6;pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.sortcard{background:var(--card2);border-radius:20px;padding:26px 18px;font-size:25px;font-weight:bold;text-align:center;margin:8px 0 16px;min-height:120px;display:grid;place-items:center}
.sortcard.pop{animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:.4}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two button{padding:18px 8px;border-radius:16px;font-weight:bold;font-size:19px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.brit{background:#8d2b35}.col{background:#1d5fa8}
.hint{margin-top:14px;background:rgba(0,0,0,.3);padding:10px 16px;border-radius:99px;font-size:16px}
.hint:disabled{opacity:.35}
.sortmsg{min-height:26px;margin-top:10px;color:var(--gold);font-weight:bold}

/* feedback */
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px;background:#0a1330;border-top:4px solid var(--green);box-shadow:0 -10px 30px rgba(0,0,0,.5);animation:up .25s}
.fb.bad{border-top-color:var(--bad)}
@keyframes up{from{transform:translateY(100%)}}
.fb .in{max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:center}
.fb h4{margin:0 0 2px;font-size:22px}
.fb p{margin:0;color:var(--muted);font-size:16px}
.fb .xp{color:var(--gold);font-weight:bold}
.fb button{flex:none;background:var(--green);color:#06301e;font-weight:bold;padding:14px 24px;border-radius:14px;font-size:20px;box-shadow:0 4px 0 #17794f}
.fb.bad button{background:var(--gold);color:#3a2b00;box-shadow:0 4px 0 #b88a00}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2b00;font-weight:bold;padding:10px 20px;border-radius:99px;z-index:50;animation:drop 2.2s forwards;box-shadow:0 6px 20px rgba(0,0,0,.4)}
@keyframes drop{0%{top:-60px}12%,80%{top:16px}100%{top:-60px}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:40}

/* end */
.center{text-align:center}
.stars{font-size:60px;letter-spacing:8px}
.stat{display:flex;justify-content:space-around;text-align:center}
.stat b{display:block;font-size:30px;color:var(--gold)}
.review li{margin:6px 0;font-size:16px;color:var(--muted)}
@media (max-width:520px){ body{font-size:18px} .match{gap:8px} .fb .in{flex-direction:column;align-items:stretch;text-align:center} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<!-- HOME -->
<div id="home" class="wrap">
  <div class="row"><div></div><button class="icon" id="muteH" title="Sound on/off">🔊</button></div>
  <h1>🇺🇸 Revolution <span>Quest</span></h1>
  <p class="sub">Beat the Redcoat army by answering questions. New questions every mission!</p>

  <div class="card">
    <div class="rank"><div class="big" id="rankIcon">🪖</div>
      <div style="flex:1"><b id="rankName">Recruit</b>
        <div class="bar xpbar" style="margin:6px 0 2px"><i id="rankBar" style="width:0"></i></div>
        <small id="rankTxt" style="color:var(--muted)"></small></div></div>
  </div>

  <div class="card"><h3>1 · Mission length</h3>
    <div class="seg" id="lenSeg">
      <button data-v="6" class="on">⚡ Quick<small>6 questions</small></button>
      <button data-v="10">🎯 Standard<small>10 questions</small></button>
      <button data-v="16">🏆 Epic<small>16 questions</small></button>
    </div></div>

  <div class="card"><h3>2 · What to practice</h3>
    <div class="seg" id="topicSeg">
      <button data-v="all" class="on">🌎 Everything</button>
      <button data-v="acts">📜 Acts &amp; Taxes</button>
      <button data-v="war">⚔️ War &amp; People</button>
      <button data-v="time">⏳ Timeline</button>
    </div></div>

  <button class="go" id="startBtn">START MISSION!</button>

  <div class="card" style="margin-top:22px"><h3>Badges</h3><div class="badges" id="badges"></div></div>
  <div class="row"><small style="color:var(--muted)" id="statsLine"></small><button class="link" id="resetBtn">reset progress</button></div>
</div>

<!-- GAME -->
<div id="game" class="wrap hidden">
  <div class="hud">
    <button class="icon" id="quitBtn" title="Quit mission">🏠</button>
    <span class="pill">⭐ <span id="hudXp">0</span> XP</span>
    <span class="pill" id="hudStreak">🔥 0</span>
    <button class="icon" id="muteG" title="Sound on/off">🔊</button>
  </div>
  <div class="enemy"><span>🇬🇧 Redcoat Army</span><span id="progTxt"></span></div>
  <div class="bar hpbar"><i id="hp" style="width:100%"></i></div>
  <div class="dots" id="dots"></div>
  <div id="stage"></div>
</div>
<div id="fb" class="fb hidden"><div class="in"><div style="flex:1"><h4 id="fbTitle"></h4><p id="fbText"></p></div><button id="fbBtn">Continue ▶</button></div></div>

<!-- END -->
<div id="end" class="wrap hidden center">
  <h1 id="endTitle">Victory!</h1>
  <div class="stars" id="stars"></div>
  <div class="card stat">
    <div><b id="eXp">0</b>XP earned</div>
    <div><b id="eAcc">0%</b>first try</div>
    <div><b id="eStreak">0</b>best streak</div>
  </div>
  <div class="card" id="rankUp"></div>
  <div class="card hidden" id="newBadges"><h3>New badges!</h3><div class="badges" id="newBadgeList" style="justify-content:center"></div></div>
  <div class="card hidden" id="reviewCard" style="text-align:left"><h3>Quick review</h3><ul class="review" id="reviewList"></ul></div>
  <button class="go" id="againBtn">PLAY AGAIN (new questions!)</button>
  <button class="link" id="homeBtn" style="font-size:18px;margin-top:10px">← back to menu</button>
</div>

<script>
"use strict";
/* =====================================================================
   QUESTION BANKS  — edit/add here. All based on Clark's notes + study guide.
   t: 'acts' (Acts & Taxes) or 'war' (War & People)
   ===================================================================== */

// Multiple choice: q, a (right answer), d (wrong answers; 3 get picked at random), ex (explanation)
const MC = [
 {t:"acts",q:"What did the Navigation Acts require?",a:"Goods could only be shipped on British ships",d:["Colonists couldn't settle west of the Appalachians","A tax on all printed paper","Soldiers had to live in colonists' homes","Only the East India Company could sell tea"],ex:"Navigation Acts: colonists had to transport goods only on British ships."},
 {t:"acts",q:"What was the main PURPOSE of the Navigation Acts?",a:"To make England a wealthy nation",d:["To punish Boston","To help colonists trade freely","To protect Native American land","To stop colonists from printing newspapers"],ex:"The goal was to make England wealthy."},
 {t:"acts",q:"How did many colonists react to the Navigation Acts?",a:"They ignored the laws and smuggled",d:["They formed the First Continental Congress","They dumped tea in the harbor","They wrote the Declaration of Independence","They happily followed every rule"],ex:"Smuggling was prominent!"},
 {t:"acts",q:"Britain answered colonial smuggling by passing the Sugar Act and ___.",a:"the Writs of Assistance",d:["the Stamp Act","the Tea Act","the Townshend Acts","the Declaratory Act"],ex:"British response: the Sugar Act and Writs of Assistance."},
 {t:"acts",q:"What did the Proclamation of 1763 do?",a:"Banned settlement and fur trapping west of the Appalachian Mountains",d:["Taxed all printed materials","Closed Boston Harbor","Let officials search any building","Gave the East India Company a tea monopoly"],ex:"No settling or fur trapping west of the Appalachians."},
 {t:"acts",q:"Why did Britain pass the Proclamation of 1763?",a:"To calm Native Americans and save money protecting settlers on the frontier",d:["To punish Boston for the Tea Party","To raise money from tea","To stop smuggling","To start a war with France"],ex:"Britain wanted to pacify the Indians and avoid the cost of protecting frontier settlers."},
 {t:"acts",q:"How did many colonists respond to the Proclamation of 1763?",a:"They defied it and moved west anyway",d:["They obeyed it completely","They moved back to England","They boycotted tea","They formed the Sons of Liberty that night"],ex:"Many colonists defied the Proclamation and moved anyway."},
 {t:"acts",q:"What did the Writs of Assistance allow?",a:"Customs officials to search any building for any reason",d:["Soldiers to search only ships","Colonists to trade freely","Judges to hold jury trials","Parliament to close the colonial legislature"],ex:"Legal papers that let customs officials search ANY building for any reason (not just ships!)."},
 {t:"acts",q:"The Writs of Assistance were an attempt to stop what?",a:"Smuggling",d:["Boycotts","Street protests","Newspaper printing","Settlement in the west"],ex:"The writs were meant to stop smuggling."},
 {t:"acts",q:"Why did colonists complain about the Writs of Assistance?",a:"They violated their rights as English subjects",d:["They raised the price of tea","They closed Boston Harbor","They banned settling west","They made colonists pay in gold"],ex:"Colonists said the writs violated their rights as English subjects."},
 {t:"acts",q:"What did the Sugar Act (1764) do to the tax on molasses?",a:"Lowered it but enforced it much more strictly",d:["Raised it a lot","Got rid of it forever","Added a stamp to it","Made it payable only in gold"],ex:"It reduced the tax but gave Britain tools to crack down on smugglers."},
 {t:"acts",q:"Under the Sugar Act, where were suspected smugglers tried?",a:"In England, by Crown-appointed judges (no jury)",d:["In Boston, by a jury of neighbors","At the Stamp Act Congress","By the Sons of Liberty","In New York by the legislature"],ex:"Smugglers were sent to England for trial with Crown-appointed judges, not a jury."},
 {t:"acts",q:"Why were colonists upset about the Sugar Act?",a:"It took away their right to a trial by jury",d:["It banned all sugar","It closed their ports","It forced them to house soldiers","It banned printing"],ex:"They felt it took away their right of trial by jury."},
 {t:"acts",q:"What did the Stamp Act tax?",a:"Almost all printed materials",d:["Tea","Glass, paint and lead","Sugar and molasses","Ships' cargo"],ex:"The Stamp Act was a direct tax on almost all printed materials."},
 {t:"acts",q:"Why did Britain pass the Stamp Act?",a:"To raise money (revenue) for Britain",d:["To punish Boston","To stop smuggling","To keep settlers east of the mountains","To give the East India Company a monopoly"],ex:"It was an attempt to raise revenue for Britain."},
 {t:"acts",q:"Which was NOT something colonists did to protest the Stamp Act?",a:"Dumped tea in Boston Harbor",d:["Formed the Sons and Daughters of Liberty","Boycotted trade with England","Harassed tax collectors","Held the Stamp Act Congress"],ex:"The tea dumping came later (1773), in response to the Tea Act."},
 {t:"acts",q:"Where did the Stamp Act Congress meet?",a:"New York",d:["Boston","Philadelphia","Jamestown","Lexington"],ex:"Delegates met in New York."},
 {t:"acts",q:"How many colonies sent delegates to the Stamp Act Congress?",a:"Nine",d:["Three","Five","Thirteen","Seven"],ex:"Nine colonies sent delegates."},
 {t:"acts",q:"What did the Stamp Act Congress send to King George III and Parliament?",a:"Petitions (letters) saying Parliament had no right to tax the colonies",d:["A declaration of war","A tea shipment","A list of Redcoat spies","A request for more taxes"],ex:"Parliament paid little attention to the petitions."},
 {t:"acts",q:"What did the Stamp Act crisis bring to the colonies?",a:"A sense of unity",d:["A sense of boredom","Peace with Britain","A new king","More smuggling laws"],ex:"The crisis brought a sense of unity to the colonies."},
 {t:"acts",q:"What happened to the Stamp Act in 1766?",a:"Parliament repealed (cancelled) it",d:["It was made stricter","Colonists began to accept it","The King doubled it","It only applied to Boston"],ex:"The boycott hurt British trade and workers, so Parliament repealed it."},
 {t:"acts",q:"What did the colonists' boycott do to British trade?",a:"Trade fell off and British workers suffered",d:["Trade doubled","Nothing happened","British workers got raises","It made Britain richer"],ex:"The boycott took its toll!"},
 {t:"acts",q:"The Declaratory Act (1766) said Parliament could tax the colonies...",a:"in all cases whatsoever",d:["only if colonists agreed","only during war","only on tea","never again"],ex:"It repealed the Stamp Act but asserted British authority 'in all cases whatsoever'."},
 {t:"acts",q:"Why did Parliament pass the Declaratory Act?",a:"To show Britain still had the authority to tax the colonies",d:["To end all taxes forever","To punish Boston","To give colonists a seat in Parliament","To start the Sons of Liberty"],ex:"Britain wanted to assert its authority to tax whenever it wanted."},
 {t:"acts",q:"How did colonists view the repeal of the Stamp Act?",a:"As a victory",d:["As a defeat","As an insult","As a reason to move west","As a signal of war"],ex:"The colonists considered it a victory."},
 {t:"acts",q:"Which items did the Townshend Acts tax?",a:"Glass, paper, paint, lead, and tea",d:["Sugar, tobacco, and molasses","Newspapers and playing cards","Gold, silver, and furs","Ships and cargo"],ex:"Townshend duties: glass, paper, paint, lead and tea."},
 {t:"acts",q:"How did the Townshend duties have to be paid?",a:"In gold or silver at the port of entry",d:["With paper money","With tea","With furs","By mail"],ex:"Gold or silver only, at the port."},
 {t:"acts",q:"What else did the Townshend Acts do?",a:"Suspended the New York legislature",d:["Closed Boston Harbor","Banned newspapers","Moved the capital to London","Gave Boston to France"],ex:"They suspended the New York legislature."},
 {t:"acts",q:"How did colonists respond to the Townshend Acts?",a:"They renewed their boycott of British goods",d:["They moved west","They wrote the Declaration","They accepted them","They stopped boycotting"],ex:"The Townshend Acts challenged 'taxation without representation', so the boycotts came back."},
 {t:"acts",q:"How many colonists were killed in the Boston Massacre (1770)?",a:"Five",d:["One","Three","Eleven","Twenty"],ex:"Five colonists were killed in a clash with British troops."},
 {t:"acts",q:"What did the Tea Act (1773) do?",a:"Kept the tax on tea and gave the East India Company a monopoly",d:["Banned tea completely","Taxed printed paper","Closed Boston Harbor","Let colonists import tea tax-free"],ex:"It kept the tax and gave the East India Company a monopoly."},
 {t:"acts",q:"Why did Britain keep the tax on tea?",a:"To show it still had the right to tax the colonists",d:["Because tea was rare","To help colonial farmers","To pay the East India Company's debts","To please the Sons of Liberty"],ex:"Britain kept the tax to prove it could tax them."},
 {t:"acts",q:"Who staged the Boston Tea Party?",a:"The Sons of Liberty",d:["The Redcoats","The East India Company","The Stamp Act Congress","King George III"],ex:"The Sons of Liberty dumped the tea."},
 {t:"acts",q:"Why did colonists stage the Boston Tea Party?",a:"To protest the tax on tea and the East India Company's monopoly",d:["To celebrate the Declaration of Independence","Because they didn't like how tea tasted","To start the French and Indian War","To get a seat in Parliament"],ex:"It was a protest against the Tea Act and 'taxation without representation'."},
 {t:"acts",q:"Besides the Boston Tea Party, colonists organized ___ to share news and plans.",a:"Committees of Correspondence",d:["The Stamp Act Congress","The Redcoat Council","The Tea Board","The Navigation Committee"],ex:"Committees of Correspondence spread news between colonies."},
 {t:"acts",q:"How many Intolerable (Coercive) Acts did Parliament pass?",a:"Four",d:["Two","Three","Seven","Twelve"],ex:"The King was furious, so Parliament passed four new laws."},
 {t:"acts",q:"Why were the Intolerable Acts passed?",a:"To punish Boston for the Tea Party and isolate it from the other colonies",d:["To pay for the French and Indian War","To stop smuggling","To end the Stamp Act","To protect Native Americans"],ex:"They were meant to punish and isolate Boston."},
 {t:"acts",q:"Which was one of the Intolerable Acts?",a:"Closing Boston Harbor until the tea was paid for",d:["A tax on printed paper","Banning settlement west of the mountains","Giving colonists a jury trial","Ending the Navigation Acts"],ex:"They closed Boston Harbor, restricted colonial government, let troops be housed anywhere, and let British officials be tried in England."},
 {t:"acts",q:"Under the Intolerable Acts, where could British officials accused of crimes stand trial?",a:"England",d:["Boston","Philadelphia","France","Virginia"],ex:"They could be tried in England."},
 {t:"acts",q:"How did colonists respond to the Intolerable Acts?",a:"Sent supplies to Boston, boycotted, and formed the First Continental Congress",d:["Moved west","Surrendered","Paid for the tea","Wrote Common Sense"],ex:"They sent aid to Boston, boycotted British goods, and set up the First Continental Congress."},
 {t:"acts",q:"What does 'No taxation without representation' mean?",a:"Colonists shouldn't be taxed by a Parliament they have no voice in",d:["Colonists shouldn't pay any taxes ever","Only rich people should be taxed","Tea shouldn't be taxed","Parliament should move to America"],ex:"This was the colonists' main slogan."},
 {t:"acts",q:"Who did colonists say had the right to pass taxes on them?",a:"Only the colonists or their elected representatives",d:["The King alone","Parliament alone","The East India Company","British soldiers"],ex:"Colonists were willing to pay taxes passed by their own colonial legislatures."},
 {t:"acts",q:"Which old English document supported the idea of no taxation without representation?",a:"The Magna Carta (1215)",d:["Common Sense","The Declaration of Independence","The Stamp Act","The Declaratory Act"],ex:"See the Magna Carta, 1215."},
 {t:"acts",q:"Who were the Sons of Liberty?",a:"Colonists who protested British taxes and laws",d:["British soldiers","Loyal tax collectors","French allies","Members of Parliament"],ex:"Sons (and Daughters) of Liberty protested in the streets and staged the Boston Tea Party."},
 {t:"acts",q:"Why were colonists so angry about taxes after the French and Indian War?",a:"They had no representatives in Parliament that was taxing them",d:["Taxes were higher than in Britain","They had to pay in tea","They didn't know about the war","They wanted to stay British"],ex:"No colonial representation in Parliament = no British taxes."},

function tone(f,t0,d,type,v){
  if(S.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
    const t=AC.currentTime+t0;g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}

function burst(x,y,n){
  if(reduced)return;
  const cols=["#e63946","#ffc93c","#4dabf7","#fff","#2ec27e"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;
    P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:3+Math.random()*4,c:rand(cols),l:60+Math.random()*30});}
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.l--;cx.globalAlpha=Math.max(0,p.l/60);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r*1.6,p.r);});
  P=P.filter(p=>p.l>0);
  raf=P.length?requestAnimationFrame(loop):0;
  if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

function weight(id){return (1+1.5*(S.missed[id]||0))/(1+.6*(S.seen[id]||0));} // favors new + previously-missed
function pickWeighted(items,topic,used){
  const pool=items.filter(it=>(topic==="all"||it.t===topic)&&!used.has(it.id));
  if(!pool.length)return null;
  let r=Math.random()*pool.reduce((s,it)=>s+weight(it.id),0);
  for(const it of pool){r-=weight(it.id);if(r<=0)return it;}
  return pool[pool.length-1];
}
function timelineFor(topic){return TIMELINE.filter(e=>topic==="all"||topic==="time"||e.t===topic);}
function distinctYears(events,n){
  const out=[],seen=new Set();
  for(const e of shuffle(events)){if(!seen.has(e.y)){seen.add(e.y);out.push(e);if(out.length===n)break;}}
  return out;
}
function pairsFor(topic){return PAIRS.filter(p=>topic==="all"||p.t===topic);}

   const p=rand(free),others=shuffle(pool.filter(x=>x!==p)).slice(0,3);

   return {type:"sort",id:"sort:"+Math.random(),noStat:true,topic:"acts",tag:"Action vs. Reaction ⚡",prompt:"Who did this: Britain, or the colonists?",

function buildQueue(len,topic){
  const used=new Set(),out=[];let last=null,heavy=0,guard=0;const cap=Math.max(1,Math.ceil(len/3));
  while(out.length<len&&guard++<600){
    const keys=Object.keys(GENS).filter(k=>k!==last&&!(GENS[k].heavy&&heavy>=cap));
    let r=Math.random()*keys.reduce((s,k)=>s+GENS[k].w,0),k=keys[0];
    for(const kk of keys){r-=GENS[kk].w;if(r<=0){k=kk;break;}}
    const q=GENS[k].make(topic,used);if(!q)continue;
    used.add(q.id);out.push(q);last=k;if(GENS[k].heavy)heavy++;
  }
  return out;
}

  const i=rankOf(S.xp),r=RANKS[i],nx=RANKS[i+1];
  $("#rankIcon").textContent=r[2];$("#rankName").textContent=r[1];
  if(nx){$("#rankBar").style.width=Math.min(100,(S.xp-r[0])/(nx[0]-r[0])*100)+"%";$("#rankTxt").textContent=S.xp+" XP · "+(nx[0]-S.xp)+" more to become "+nx[1];}
  else{$("#rankBar").style.width="100%";$("#rankTxt").textContent=S.xp+" XP · MAX RANK!";}
  $("#badges").innerHTML="";
  Object.keys(BADGES).forEach(k=>{const b=el("div","badge"+(S.badges[k]?"":" locked"),BADGES[k].i+" "+BADGES[k].n);b.title=BADGES[k].d;$("#badges").append(b);});
  $("#statsLine").textContent="Missions: "+S.missions+" · Best streak: "+S.best;
  syncMute();
}
function segBind(id,key){
  $(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
    $(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    sel[key]=key==="len"?+b.dataset.v:b.dataset.v;};
}
segBind("#lenSeg","len");segBind("#topicSeg","topic");

function startMission(){
  const queue=buildQueue(sel.len,sel.topic);
  M={len:queue.length,queue,cur:null,idx:0,xp:0,streak:0,best:0,correct:0,firstTry:0,rally:[],wrong:[],hints:2,
     locked:false,hinted:false,keys:{},status:[],newBadges:[],rallyMode:false,startRank:rankOf(S.xp),sawOrderOk:false};
  show("game");updateHud();next();
}
function updateHud(){
  $("#hudXp").textContent=M.xp;$("#hudStreak").textContent="🔥 "+M.streak;
  $("#hp").style.width=Math.max(0,100-M.correct/M.len*100)+"%";
  const dots=$("#dots");dots.innerHTML="";
  for(let i=0;i<M.len;i++){const d=el("i",M.status[i]||(i===M.idx?"now":""));dots.append(d);}
  $("#progTxt").textContent=M.rallyMode?"Rally round!":"Question "+Math.min(M.idx+1,M.len)+" of "+M.len;
}
function next(){
  $("#fb").classList.add("hidden");
  if(!M.queue.length){
    if(M.rally.length&&!M.rallyMode){M.rallyMode=true;M.queue=shuffle(M.rally);M.queue.forEach(q=>q.rally=true);M.rally=[];toast("💪 Rally round: second chances!");}
    else return finish();
  }
  M.cur=M.queue.shift();M.locked=false;M.hinted=false;M.keys={};
  updateHud();renderQ(M.cur);
}
function renderQ(q){
  const st=$("#stage");st.innerHTML="";
  st.append(el("span","tag"+(q.rally?" rally":""),q.rally?"Second chance · +5 XP":q.tag));
  const p=el("div","prompt");st.append(p);
  if(q.type!=="fill")p.textContent=q.prompt;
  R[q.type](q,st,p);
}

const R={};
function hintBtn(st,btns){
  const b=el("button","hint","💡 50/50 hint ("+M.hints+" left)");
  b.disabled=M.hints<1;
  b.onclick=()=>{
    if(M.locked||M.hints<1)return;M.hints--;M.hinted=true;
    shuffle(btns.filter(x=>!x.o.ok&&!x.b.classList.contains("gone"))).slice(0,2).forEach(x=>{x.b.classList.add("gone");x.b.disabled=true;});
    b.disabled=true;b.textContent="💡 Hint used (half XP)";
  };
  st.append(b);
}
R.mc=function(q,st){
  const box=el("div","opts"),btns=[];
  shuffle(q.opts).forEach((o,i)=>{
    const b=el("button","opt");b.append(el("span","key",String(i+1)),el("span","",o.t));
    b.onclick=()=>{
      if(M.locked)return;
      btns.forEach(x=>{x.b.disabled=true;if(x.o.ok)x.b.classList.add("ok");});
      if(!o.ok)b.classList.add("bad");
      resolve(o.ok,q.ex);
    };
    btns.push({b,o});box.append(b);M.keys[String(i+1)]=()=>b.click();
  });
  st.append(box);hintBtn(st,btns);
};
R.tf=function(q,st){
  const box=el("div","tf");
  [["TRUE ✔",true],["FALSE ✖",false]].forEach(([t,v],i)=>{
    const b=el("button","opt",t);
    b.onclick=()=>{
      if(M.locked)return;
      [...box.children].forEach(c=>c.disabled=true);
      const ok=v===q.answer;b.classList.add(ok?"ok":"bad");
      if(!ok)[...box.children].find(c=>c!==b).classList.add("ok");
      resolve(ok,q.ex);
    };
    box.append(b);
  });
  M.keys.t=()=>box.children[0].click();M.keys.f=()=>box.children[1].click();
  st.append(box);
};
R.fill=function(q,st,p){
  const parts=q.prompt.split("___"),blank=el("span","blank","     ");
  p.append(parts[0],blank,parts[1]||"");
  const box=el("div","chips");
  q.opts.forEach((o,i)=>{
    const b=el("button","chip",o);
    b.onclick=()=>{
      if(M.locked)return;
      const ok=o===q.answer;blank.textContent=o;
      [...box.children].forEach(c=>{c.disabled=true;if(c.textContent===q.answer)c.classList.add("ok");});
      if(!ok)b.classList.add("bad");
      resolve(ok,q.ex);
    };
    box.append(b);M.keys[String(i+1)]=()=>b.click();
  });
  st.append(box);
};
R.order=function(q,st){
  const n=q.items.length,placed=Array(n).fill(null),pool=shuffle(q.items);
  const slotsEl=el("div","slots"),poolEl=el("div","pool"),go=el("button","small-go","Lock it in! 🔒");
  go.disabled=true;let checked=false;
  function draw(){
    slotsEl.innerHTML="";poolEl.innerHTML="";
    placed.forEach((it,i)=>{
      const s=el("div","slot"+(it?" filled":""));s.append(el("span","n",String(i+1)));
      if(it){s.append(el("span","",it.n));s.onclick=()=>{if(checked)return;placed[i]=null;sfx.tick();draw();};}
      else s.append(el("span","","…"));
      slotsEl.append(s);
    });
    pool.filter(it=>!placed.includes(it)).forEach(it=>{
      const b=el("button","chip",it.n);
      b.onclick=()=>{if(checked)return;const k=placed.indexOf(null);if(k<0)return;placed[k]=it;sfx.tick();draw();};
      poolEl.append(b);
    });
    go.disabled=placed.includes(null);
  }
  go.onclick=()=>{
    if(checked||M.locked)return;checked=true;
    const sorted=q.items.slice().sort((a,b)=>a.y-b.y);let all=true;
    [...slotsEl.children].forEach((s,i)=>{
      const good=placed[i].y===sorted[i].y;if(!good)all=false;
      s.classList.add(good?"ok":"bad");s.append(el("span","yr",String(placed[i].y)));
    });
    go.disabled=true;
    if(all)M.sawOrderOk=true;
    resolve(all,"Right order: "+sorted.map(e=>e.n+" ("+e.y+")").join(" → "));
  };
  draw();st.append(slotsEl,poolEl,go);
};
R.match=function(q,st){
  const L=q.pairs,Rt=shuffle(q.pairs);let selL=null,left=L.length,miss=0;
  const box=el("div","match"),cl=el("div","col"),cr=el("div","col");
  const lb=L.map(p=>{const b=el("button","m",p.n);b.style.fontWeight="bold";b.onclick=()=>{
      if(M.locked)return;lb.forEach(x=>x.classList.remove("sel"));selL=p;b.classList.add("sel");sfx.tick();};cl.append(b);return b;});
  Rt.forEach(p=>{const b=el("button","m",p.c);b.onclick=()=>{
      if(M.locked||!selL)return;
      if(selL===p){
        lb[L.indexOf(p)].classList.remove("sel");lb[L.indexOf(p)].classList.add("done");b.classList.add("done");
        selL=null;left--;sfx.good(1);
        if(!left)resolve(miss<=1,miss?"Done, with "+miss+" slip"+(miss>1?"s":"")+".":"Perfect matching!");
      }else{
        miss++;sfx.bad();b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
        lb.forEach(x=>x.classList.remove("sel"));selL=null;
      }};cr.append(b);});
  box.append(cl,cr);st.append(box);
};
R.sort=function(q,st){
  let i=0,miss=0;const wrongs=[];
  const card=el("div","sortcard"),msg=el("div","sortmsg"),two=el("div","two"),cnt=el("div","");cnt.style.color="var(--muted)";
  const bB=el("button","brit","🇬🇧 Britain did this"),bC=el("button","col","🇺🇸 Colonists reacted");
  function show1(){card.textContent=q.cards[i].t;card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");cnt.textContent=(i+1)+" / "+q.cards.length;}
  function ans(side){
    if(M.locked)return;const c=q.cards[i];
    if(c.side===side){sfx.good(1);msg.textContent="✔";}
    else{miss++;wrongs.push(c);sfx.bad();msg.textContent="Oops! That was "+(c.side==="brit"?"Britain":"the colonists")+".";}
    i++;
    if(i>=q.cards.length){
      resolve(miss<=1,miss?"Review: "+wrongs.map(w=>"“"+w.t+"” = "+(w.side==="brit"?"Britain":"colonists")).join("; "):"Perfect sorting!");
    }else show1();
  }
  bB.onclick=()=>ans("brit");bC.onclick=()=>ans("col");
  two.append(bB,bC);st.append(cnt,card,two,msg);show1();
};

function resolve(ok,ex){
  if(M.locked)return;M.locked=true;const q=M.cur;
  if(!q.noStat){S.seen[q.id]=(S.seen[q.id]||0)+1;if(!ok)S.missed[q.id]=(S.missed[q.id]||0)+1;}
  let gain;
  const fb=$("#fb");
  if(ok){
    M.streak++;M.best=Math.max(M.best,M.streak);M.correct++;if(!q.rally)M.firstTry++;
    gain=q.rally?5:10+Math.min(M.streak-1,5)*2;if(M.hinted)gain=Math.round(gain/2);M.xp+=gain;
    if(!q.rally)M.status[M.idx]="done";
    sfx.good(M.streak);burst(innerWidth/2,innerHeight*.55,M.streak>=3?60:30);
    fb.className="fb";$("#fbTitle").textContent=rand(["Nailed it!","Boom! 💥","Huzzah! 🎉","Direct hit!","Patriot power!","Yes!"])+(M.streak>=3?"  🔥×"+M.streak:"");
    if([3,5,8,12].includes(M.streak))toast("🔥 "+M.streak+" in a row!");
    if(M.streak===5)award("s5");if(M.streak===10)award("s10");
    if(q.type==="order")award("order");
  }else{
    M.streak=0;gain=2;M.xp+=2;
    if(!q.rally){M.status[M.idx]="miss";M.rally.push(q);}
    M.wrong.push(q);sfx.bad();
    fb.className="fb bad";$("#fbTitle").textContent=rand(["Not quite. Learn it, then own it!","Close! Here's the answer.","Shake it off, you'll get it next time!"]);
  }
  if(!q.rally)M.idx++;
  $("#fbText").innerHTML="";
  $("#fbText").append(el("span","xp","+"+gain+" XP  "),document.createTextNode(ex||""));
  $("#fbBtn").textContent=(M.queue.length||M.rally.length&&!M.rallyMode)?"Continue ▶":"Finish 🏁";
  updateHud();
  fb.classList.remove("hidden");
}
$("#fbBtn").onclick=next;

function finish(){
  M.correct=M.len;updateHud();
  const first=M.firstTry,acc=Math.round(first/M.len*100);
  const stars=acc>=90?3:acc>=65?2:1;
  const before=M.startRank;
  S.xp+=M.xp;S.missions++;S.best=Math.max(S.best,M.best);
  award("first");if(first===M.len)award("perfect");if(M.len>=16)award("epic");if(S.missions>=5)award("five");
  save();
  sfx.win();
  if(!reduced)for(let k=0;k<5;k++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.35,70),k*250);
  $("#endTitle").textContent=acc===100?"FLAWLESS VICTORY!":"Victory! 🇺🇸";
  $("#stars").textContent="★".repeat(stars)+"☆".repeat(3-stars);
  $("#eXp").textContent="+"+M.xp;$("#eAcc").textContent=acc+"%";$("#eStreak").textContent=M.best;
  const ra=rankOf(S.xp),r=RANKS[ra];
  const ru=$("#rankUp");ru.innerHTML="";
  if(ra>before){ru.append(el("h3","","Rank up!"),el("div","stars",r[2]),el("b","","You're now a "+r[1]+"!"));}
  else{const nx=RANKS[ra+1];ru.append(el("b","",r[2]+" "+r[1]+" · "+S.xp+" XP"));if(nx)ru.append(el("div","",(nx[0]-S.xp)+" XP to "+nx[1]));}
  const nb=$("#newBadges");nb.classList.toggle("hidden",!M.newBadges.length);
  const nl=$("#newBadgeList");nl.innerHTML="";M.newBadges.forEach(id=>nl.append(el("div","badge",BADGES[id].i+" "+BADGES[id].n)));
  const rc=$("#reviewCard"),rl=$("#reviewList");rl.innerHTML="";
  const seenLbl=new Set();M.wrong.forEach(q=>{const l=q.label||q.prompt;if(!seenLbl.has(l)){seenLbl.add(l);rl.append(el("li","",l));}});
  rc.classList.toggle("hidden",!seenLbl.size);
  show("end");
}

/* wiring */
$("#startBtn").onclick=startMission;
$("#againBtn").onclick=startMission;
$("#homeBtn").onclick=()=>{renderHome();show("home");};
$("#quitBtn").onclick=()=>{if(confirm("Leave this mission? Your XP from it won't be saved."))  {$("#fb").classList.add("hidden");renderHome();show("home");}};
$("#muteH").onclick=$("#muteG").onclick=toggleMute;
$("#resetBtn").onclick=()=>{if(confirm("Erase all XP, badges and history?")){S={xp:0,missions:0,best:0,seen:{},missed:{},badges:{},mute:S.mute};save();renderHome();}};
addEventListener("keydown",e=>{
  if($("#game").classList.contains("hidden")||!M)return;
  if(!$("#fb").classList.contains("hidden")){if(e.key==="Enter"||e.key===" "){e.preventDefault();next();}return;}
  const f=M.keys[e.key.toLowerCase()];if(f)f();
});
renderHome();
</script>
